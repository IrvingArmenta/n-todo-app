name: LLaMA 3 AI Review

on:
  pull_request:
    types: [labeled]

jobs:
  llama-review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch origin $BASE_SHA $HEAD_SHA
          git diff $BASE_SHA $HEAD_SHA > pr.diff

      - name: Review with Meta-Llama-3.1-8B Chat
        id: llama_review
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DIFF_CONTENT=$(head -c 4000 pr.diff | jq -Rs .)
          REVIEW=$(curl -s -X POST https://router.huggingface.co/featherless-ai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -d '{
              "model": "meta-llama/Meta-Llama-3.1-8B",
              "messages": [
                { "role": "system", "content": "You are a helpful code reviewer." },
                { "role": "user", "content": "Review this diff:\n---\n'"${DIFF_CONTENT}"'" }
              ],
              "max_tokens": 300,
              "temperature": 0.7,
              "top_p": 0.95
            }' | jq -r '.choices[0].message.content')
          echo "$REVIEW" > llama_response.json

      - name: Post AI review to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('llama_response.json', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **LLaMA 3 AI Review**\n\n${body}`
            });
